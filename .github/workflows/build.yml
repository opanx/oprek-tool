name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/34.0.0
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-34
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: List APK outputs
        run: find . -name "*.apk" -type f

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OprekTool-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OprekTool-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Auto Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "OprekTool v${{ steps.version.outputs.version }}"
          body: |
            ## OprekTool v${{ steps.version.outputs.version }}
            
            ### 📥 Downloads
            - **OprekTool-debug.apk** — Debug build (with logs)
            - **OprekTool-release.apk** — Release build (optimized)
            
            ### 📋 Changelog
            See [README](https://github.com/opanx/oprek-tool#readme) for full feature list.
            
            **© Panxcz & Freebuff**
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
