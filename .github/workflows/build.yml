name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process -Xmx4g"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/34.0.0
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-34
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup signing keystore
        run: |
          if [ -f release.keystore ]; then
            echo "Using committed release.keystore"
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "Using stored keystore from secrets"
          else
            echo "ERROR: No keystore found"
            exit 1
          fi
          keytool -list -keystore release.keystore -storepass oprektool2024 2>&1 | head -5

      - name: Build Debug APK (SIGNED)
        run: |
          cp release.keystore app/
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (SIGNED)
        run: |
          cp release.keystore app/
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare final APKs
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DEBUG=$(find . -name "*debug*.apk" -type f | head -1)
          if [ -n "$DEBUG" ]; then
            cp "$DEBUG" "OprekTool-v${VERSION}-debug.apk"
          fi
          RELEASE=$(find . -name "*release*.apk" -type f | head -1)
          if [ -n "$RELEASE" ]; then
            cp "$RELEASE" "OprekTool-v${VERSION}-release.apk"
          fi
          echo "=== Final APKs ==="
          ls -la *.apk 2>/dev/null || echo "No APKs found"

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OprekTool-v${{ steps.version.outputs.version }}
          path: "*.apk"
          retention-days: 30

      - name: Upload ALL to Releases (SIGNED)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "OprekTool v${{ steps.version.outputs.version }} (Signed)"
          body: |
            ## OprekTool v${{ steps.version.outputs.version }}

            ### Downloads
            - **OprekTool-v${{ steps.version.outputs.version }}-debug.apk** - Debug build (signed)
            - **OprekTool-v${{ steps.version.outputs.version }}-release.apk** - Release build (signed)

            ### Features
            - AutoDump v8 — Real IL2CPP metadata parser (TypeDef/MethodDef/FieldDef)
            - MalwareDetector v2 — Auto-deobfuscation + 15 threat categories
            - APKTool Suite — Decode APK, extract resources, manifest, DEX
            - Auto Leak Source — 9-phase binary leak scanner
            - Decompiler — Pseudo-C with batch decompile
            - 80+ reverse engineering tools
            - Navigation Drawer with categorized tools
            - Consistent signing key (no uninstall needed)
            - Zero build warnings

            ### Installation
            1. Download the APK (debug or release)
            2. Enable "Install from unknown sources" if needed
            3. Install and open

            ### Resources
            - [README](https://github.com/opanx/oprek-tool#readme)
            - [Bug Reports](https://github.com/opanx/oprek-tool/issues)

            (c) Panxcz & Freebuff
          files: "*.apk"
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
