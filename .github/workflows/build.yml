name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/34.0.0
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-34
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass oprektool2024 \
            -alias oprektool \
            -keypass oprektool2024 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=OprekTool,OU=Panxcz,O=Freebuff,L=Jakarta,ST=ID,C=ID"

      - name: Build Debug APK (SIGNED)
        run: |
          cat > app/signing.properties << 'EOF'
          storePassword=oprektool2024
          keyPassword=oprektool2024
          keyAlias=oprektool
          storeFile=../release.keystore
          EOF
          cp release.keystore app/
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (SIGNED)
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK manually
        run: |
          # Find the unsigned release APK
          UNSIGNED=$(find . -name "*release*.apk" -type f | head -1)
          if [ -n "$UNSIGNED" ]; then
            SIGNED="OprekTool-v$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')-release.apk"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass oprektool2024 \
              -keypass oprektool2024 \
              "$UNSIGNED" oprektool
            zipalign -v 4 "$UNSIGNED" "$SIGNED" 2>/dev/null || cp "$UNSIGNED" "$SIGNED"
            echo "Signed release APK: $SIGNED"
          fi

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare final APKs
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Debug APK (already signed by Gradle)
          DEBUG=$(find . -name "*debug*.apk" -type f | head -1)
          if [ -n "$DEBUG" ]; then
            cp "$DEBUG" "OprekTool-v${VERSION}-debug.apk"
          fi
          # Release APK (signed manually)
          RELEASE=$(find . -name "OprekTool-v${VERSION}-release.apk" -type f | head -1)
          if [ -z "$RELEASE" ]; then
            RELEASE=$(find . -name "*release*.apk" -type f | head -1)
            if [ -n "$RELEASE" ]; then
              cp "$RELEASE" "OprekTool-v${VERSION}-release.apk"
            fi
          fi
          echo "=== Final APKs ==="
          ls -la *.apk 2>/dev/null || echo "No APKs found"

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OprekTool-v${{ steps.version.outputs.version }}
          path: "*.apk"
          retention-days: 30

      - name: Upload ALL to Releases (SIGNED)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "OprekTool v${{ steps.version.outputs.version }} (Signed)"
          body: |
            ## 🔧 OprekTool v${{ steps.version.outputs.version }}
            
            ### 📥 Downloads (ALL SIGNED)
            - **OprekTool-v${{ steps.version.outputs.version }}-debug.apk** — Debug build (signed)
            - **OprekTool-v${{ steps.version.outputs.version }}-release.apk** — Release build (signed)
            
            ### ✨ What's New
            - Decompiler v6 (maximum accuracy)
            - Real scripting engine (JavaScript)
            - 80+ tools for reverse engineering
            - ALL APKs signed (no unsigned builds)
            - Python scripting support
            - APK Signer tool
            - Native Lib Analyzer
            
            ### 🔧 Installation
            1. Download the APK (either debug or release)
            2. Enable "Install from unknown sources" if needed
            3. Install and open
            
            ### 📚 Resources
            - [README](https://github.com/opanx/oprek-tool#readme)
            - [Indonesian README](https://github.com/opanx/oprek-tool/blob/main/README_ID.md)
            - [Bug Reports](https://github.com/opanx/oprek-tool/issues)
            
            **© Panxcz & Freebuff**
          files: |
            *.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
